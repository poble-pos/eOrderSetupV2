worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;



    # 기본 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 360s;
keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # 버퍼 설정
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 1k;

    # 타임아웃 설정
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

 
geo $is_localhost {
    default 0;
    127.0.0.1 1;
    ::1      1;
}

map $is_localhost $limit_key {
    0 $binary_remote_addr;
    1 "";
}

map $http_upgrade $connection_upgrade {
    default keep-alive;
    websocket upgrade;
}

# 연결 및 요청 제한
limit_conn_zone $limit_key zone=conn_limit_per_ip:10m;
limit_req_zone $limit_key zone=req_limit_per_ip:10m rate=10r/s;
limit_req_zone $limit_key zone=api_limit:10m rate=1r/s;

    # 업스트림 서버 설정
    upstream backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

server {
    listen 80;
    server_name localhost;

    location = /report {
        return 301 /report/;
    }

    location /report/ {
        alias C:/server/eResReport/;
        index index.html;
    }

    location / {
        return 404;
    }
}

    server {
        listen 8090;
        server_name localhost;

        # 전역 연결 제한        
       limit_conn conn_limit_per_ip 50;
	limit_req zone=req_limit_per_ip burst=20 nodelay;

        # 공통 위치 설정
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	
        }

        location /core/eres {
            
            proxy_pass http://backend/eres;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
           proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
        }

        location /core/api {
            limit_req zone=api_limit burst=5 delay=5;
            limit_req_log_level info;
            proxy_pass http://backend/api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
        }
    }
}